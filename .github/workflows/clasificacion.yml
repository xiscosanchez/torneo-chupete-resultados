name: Actualizar clasificación FFIB

on:
  push:
    paths:
      - 'scripts/clasificacion.py'
      - '.github/workflows/clasificacion.yml'
  schedule:
    # Hora española: sábado 23:30, domingo 15:00 y domingo 23:30. GitHub
    # programa en UTC y España va a UTC+2 en verano y UTC+1 en invierno, así
    # que cada hora lleva sus dos versiones: una cae exacta y la otra una hora
    # antes o después, según la época. La pasada de más no publica nada si no
    # ha cambiado la clasificación.
    - cron: '30 21,22 * * 6'   # sábado 23:30
    - cron: '0 13,14 * * 0'    # domingo 15:00
    - cron: '30 21,22 * * 0'   # domingo 23:30
  workflow_dispatch:
    inputs:
      url:
        description: 'URL de la clasificación en ffib.es (vacío = la configurada)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: clasificacion
  cancel-in-progress: false

env:
  # Se puede sobrescribir con la variable de repositorio CLASIFICACION_URL
  # (Settings → Secrets and variables → Actions → Variables).
  DEFAULT_URL: 'https://www.ffib.es/Fed/NPcd/NFG_VisClasificacion?cod_primaria=1000110&codjornada=1&codcompeticion=23348373&codgrupo=23348374&codjornada=1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4

      - name: Descargar clasificación y escudos
        env:
          INPUT_URL: ${{ inputs.url }}
          VAR_URL: ${{ vars.CLASIFICACION_URL }}
        run: |
          URL="${INPUT_URL:-${VAR_URL:-$DEFAULT_URL}}"
          echo "URL: $URL"
          python3 scripts/clasificacion.py --url "$URL" --out data/clasificacion.json --escudos data/escudos

      - name: Publicar cambios
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en la clasificación"
            exit 0
          fi
          git commit -m "Actualizar clasificación FFIB ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
