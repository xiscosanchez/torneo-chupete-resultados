name: GesDep · volcar desde la app

# La app del equipo lanza este flujo (repository_dispatch) con los datos de
# una convocatoria; el robot entra en GesDep con la cuenta del club y la
# crea. En modo "prueba" rellena el formulario, hace captura y no guarda.
# También se puede lanzar a mano pegando el JSON.
on:
  repository_dispatch:
    types: [gesdep-convocatoria]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON del payload (ver gesdep/convocatoria.js)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gesdep
  cancel-in-progress: false

jobs:
  convocatoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        working-directory: gesdep
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Crear la convocatoria en GesDep
        working-directory: gesdep
        env:
          GESDEP_USER: ${{ secrets.GESDEP_USER }}
          GESDEP_PASS: ${{ secrets.GESDEP_PASS }}
          GESDEP_CALLBACK_SECRET: ${{ secrets.GESDEP_CALLBACK_SECRET }}
          GESDEP_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.datos) || inputs.payload }}
        run: node convocatoria.js
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesdep-capturas-${{ github.run_id }}
          path: gesdep/salida/
          retention-days: 14
